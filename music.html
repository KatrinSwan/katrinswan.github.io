<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Музыка — KateSwan</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4eee8;
            --card-bg: #fffbf5;
            --text: #3e2e23;
            --accent: #9f7e69;
            --accent-light: #e7dbce;
            --border: #dccbb8;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius: 20px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 20% 30%, #fff4e6 0%, #e6d5c3 100%);
            font-family: 'Lora', 'Georgia', serif;
            color: var(--text);
            line-height: 1.8;
            overflow-x: hidden;
        }

        h1, h2, h3, .logo {
            font-family: 'Playfair Display', 'Georgia', serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Меню */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 251, 245, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: 1.8rem;
            font-style: italic;
            color: var(--text);
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #f0e0d0;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            color: #6b4f3a;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
            padding: 6px 0;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .burger {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
            z-index: 1001;
        }

        .burger span {
            display: block;
            width: 28px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            transition: 0.3s;
        }

        .burger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 6px);
        }

        .burger.active span:nth-child(2) {
            opacity: 0;
        }

        .burger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -6px);
        }

        /* Страница музыки */
        .music-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 20px 80px;
        }

        .music-page h1 {
            font-size: 2.5rem;
            font-style: italic;
            margin-bottom: 8px;
            color: var(--text);
            text-shadow: 2px 2px 0 #f0e0d0;
        }

        .subtitle {
            color: #6b4f3a;
            margin-bottom: 30px;
            font-style: italic;
        }

        .player-section {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 30px 24px 24px;
            box-shadow: inset 0 0 0 1px #ede0d4, 0 6px 20px -6px rgba(0, 0, 0, 0.08);
        }

        .player-section h2 {
            font-size: 1.8rem;
            font-style: italic;
            color: var(--text);
            margin-bottom: 8px;
            text-align: center;
        }

        .player-section > p {
            color: #6b4f3a;
            margin-bottom: 20px;
            text-align: center;
        }

        .yandex-player {
            width: 100%;
            border-radius: 20px;
            border: none;
            background: transparent;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #7d6654;
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
        }

        .signoff {
            font-style: italic;
            margin-bottom: 10px;
        }

        .social-links {
            margin: 10px 0;
        }

        .social-links a {
            color: #6b2e2e;
            text-decoration: none;
            margin: 0 10px;
        }

        .social-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 65px;
                left: 0;
                width: 100%;
                background: var(--card-bg);
                padding: 20px;
                gap: 12px;
                border-bottom: 1px solid var(--border);
            }

            .nav-links.active {
                display: flex;
            }

            .burger {
                display: flex;
            }

            .music-page h1 {
                font-size: 2rem;
            }

            .player-section h2 {
                font-size: 1.5rem;
            }

            .player-section {
                padding: 20px 16px 16px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <nav>
            <a href="index.html" class="logo">Kate Swan</a>
            <div class="burger" id="burger">
                <span></span><span></span><span></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Главная</a></li>
                <li><a href="index.html#about">О себе</a></li>
                <li><a href="music.html" class="active">Музыка</a></li>
                <li><a href="game.html">Рифмоплёт</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section class="music-page">
        <h1>🎵 Музыка</h1>
        <p class="subtitle">Слушайте все мои треки на Яндекс Музыке</p>

        <div class="player-section">
            <h2>Послушать прямо сейчас</h2>
            <p>Все релизы и плейлисты — в одном плеере</p>
            <iframe class="yandex-player"
                    src="https://music.yandex.ru/iframe/#artist/26008833/playlists/"
                    height="420"
                    frameborder="0"
                    allowfullscreen>
            </iframe>
        </div>
    </section>
</main>

<footer>
    <p class="signoff">С морским приветом, KateSwan</p>
    <div class="social-links">
        <a href="https://vk.com/kateswan_creator" target="_blank">ВКонтакте</a>
        <a href="https://music.yandex.ru/artist/26008833" target="_blank">Яндекс Музыка</a>
    </div>
    <p class="copyright">© 2026 KateSwan. Все права защищены.</p>
</footer>

<script>
    const burger = document.getElementById('burger');
    const navLinks = document.getElementById('navLinks');
    if (burger) {
        burger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            burger.classList.toggle('active');
        });
    }
    if (navLinks) {
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                burger.classList.remove('active');
            });
        });
    }
</script>
</body>
</html>
